[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gentoo-live-installer"
version = "0.1.0"
description = "A guided AMD64 Gentoo installer for the live desktop"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
gentoo-installer = "gentoo_installer.app:main"
gentoo-installerd = "gentoo_installerd.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the tests package and scripts/ importable, "src" the installer packages,
# so a bare `pytest` (IDE, CI) collects the same suite as scripts/test.sh.
pythonpath = [".", "src"]
# anyio and pkgcore are autoloaded from the system site-packages (the venv uses
# include-system-site-packages) and are not needed here.
addopts = "-ra -p no:anyio -p no:pkgcore"
# Per-test limit in seconds: pytest-timeout when installed, tests/conftest.py otherwise.
timeout = 120
