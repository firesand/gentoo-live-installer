[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gentoo-live-installer"
version = "0.1.0"
description = "A guided AMD64 Gentoo installer for the live desktop"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-timeout>=2.3"]

[project.scripts]
gentoo-installer = "gentoo_installer.app:main"
gentoo-installerd = "gentoo_installerd.server:main"
gentoo-installer-text = "gentoo_installer.textui.cli:main"
gentoo-rescue = "gentoo_installerd.rescue.cli:main"
gentoo-rescue-gui = "gentoo_installer.rescue_app:main"
gentoo-remote-access = "gentoo_installer.remote_cli:main"
gentoo-rescue-agents = "gentoo_rescue_ai.agents:main"
gentoo-rescue-login = "gentoo_rescue_ai.login:main"
gentoo-rescue-ai = "gentoo_rescue_ai.launcher:main"
gentoo-rescue-do = "gentoo_rescue_ai.do_client:main"
gentoo-rescue-approver = "gentoo_rescue_ai.approver:main"
gentoo-rescue-mount = "gentoo_rescue_ai.mount:main"
gentoo-rescue-share = "gentoo_rescue_ai.share:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The pins, AGENTS.md, the agents' safe configs and the hook: the iso owner installs data/root as it is.
gentoo_rescue_ai = [
    "data/*.json", "data/root/etc/*/*", "data/root/etc/*/*/*",
    "data/root/etc/skel-rescue-ai/.codex/*", "data/root/etc/skel-rescue-ai/.config/opencode/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/hwmonux/tests"]
# "." makes the tests package importable, "src" the installer packages and "scripts" the
# vm_*.py helper modules, so a bare `pytest` (IDE, CI) collects the same suite as scripts/test.sh.
pythonpath = [".", "src", "scripts"]
# anyio and pkgcore are autoloaded from the system site-packages (the venv uses
# include-system-site-packages) and are not needed here.
addopts = "-ra -p no:anyio -p no:pkgcore"
# Per-test limit in seconds: pytest-timeout when installed, tests/conftest.py otherwise.
timeout = 120

[tool.mypy]
# scripts/check.sh compares the findings with scripts/mypy-baseline.txt.
python_version = "3.13"
mypy_path = "src:scripts"
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
