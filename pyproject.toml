[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gentoo-live-installer"
version = "0.1.0"
description = "A guided AMD64 Gentoo installer for the live desktop"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
gentoo-installer = "gentoo_installer.app:main"
gentoo-installerd = "gentoo_installerd.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
