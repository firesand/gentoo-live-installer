[package]
description = "Gentoo Settings — CachyOS-Settings style system tuning for Gentoo (OpenRC and systemd), with a Steam-styled GUI"
license = "GPL-3.0-or-later"
name = "gentoo-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
readme = "README.md"
default-run = "gentoo-settings"

[dependencies]
eframe = "0.36.1"
egui = "0.36.2"
egui-phosphor = "0.14.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
