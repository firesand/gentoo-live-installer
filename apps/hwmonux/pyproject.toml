[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwmonux"
version = "1.0.0"
description = "An HWMonitor-style hardware sensor viewer for Linux"
requires-python = ">=3.9"
dependencies = ["PySide6"]

[project.scripts]
hwmonux = "hwmonux:main"

[tool.setuptools]
py-modules = ["hwmonux", "sensors"]
