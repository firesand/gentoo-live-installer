# Only the assignments listed in iso/make_conf_keys.py are used from this file: Catalyst
# writes /etc/portage/make.conf itself (USE comes from the specs) and drops everything
# else. iso/render-config.py copies these settings to make.conf.extra and
# iso/catalyst-no-loop.py appends them after each Catalyst rewrite. The build chroot gets
# all of them, the live image only make_conf_keys.LIVE_KEYS (and FEATURES without
# buildpkg), so no builder job count or licence wildcard leaks onto somebody's PC.
#
# No -march=native: the image has to run on every x86-64 CPU.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
MAKEOPTS="-j@JOBS@"
# An explicitly empty inherited NINJAOPTS disables Gentoo's MAKEOPTS fallback.
# Keep Ninja bounded even when PySide invokes it directly through Python.
NINJAOPTS="-j@JOBS@ -l@LOAD_AVERAGE@"
# sys-kernel/gentoo-kernel is built here with the fragment of the live package (Safe graphics);
# a binary package from the binhost or from an earlier build would silently lack it.
# The single definition: iso/builder-entrypoint.sh exports this value for Catalyst's
# envvars. Catalyst adds --jobs and --load-average itself.
EMERGE_DEFAULT_OPTS="--getbinpkg --binpkg-respect-use=y --usepkg-exclude=app-admin/gentoo-live-installer --usepkg-exclude=app-misc/hwmonux --usepkg-exclude=app-portage/portagehub --usepkg-exclude=acct-group/gentoo-installer --usepkg-exclude=sys-kernel/gentoo-kernel"
ACCEPT_LICENSE="*"
GRUB_PLATFORMS="pc efi-64"
INPUT_DEVICES="libinput"
VIDEO_CARDS="amdgpu ast fbdev intel nouveau qxl radeon radeonsi vesa virtualbox vmware"
# The Gentoo binrepo sets verify-signature=true; a global signature requirement
# would also reject unsigned local packages made by Catalyst's --buildpkg.
# protect-owned permits unowned compatibility links created by Gentoo
# postinst hooks (for example cpio -> gcpio) while rejecting package collisions.
FEATURES="binpkg-logs buildpkg protect-owned parallel-fetch strict"
PYTHON_TARGETS="python3_14"
PYTHON_SINGLE_TARGET="python3_14"
