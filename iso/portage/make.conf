COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
MAKEOPTS="-j@JOBS@"
# An explicitly empty inherited NINJAOPTS disables Gentoo's MAKEOPTS fallback.
# Keep Ninja bounded even when PySide invokes it directly through Python.
NINJAOPTS="-j@JOBS@ -l@LOAD_AVERAGE@"
EMERGE_DEFAULT_OPTS="--jobs=@JOBS@ --load-average=@LOAD_AVERAGE@ --verbose --getbinpkg --binpkg-respect-use=y --usepkg-exclude=app-admin/gentoo-live-installer --usepkg-exclude=app-misc/hwmonux --usepkg-exclude=app-portage/portagehub --usepkg-exclude=acct-group/gentoo-installer"
USE="X wayland accessibility cryptsetup device-mapper lvm mdadm networkmanager policykit qt6 gtk dbus elogind pulseaudio -systemd"
ACCEPT_LICENSE="*"
GRUB_PLATFORMS="pc efi-64"
INPUT_DEVICES="libinput"
VIDEO_CARDS="amdgpu ast fbdev intel nouveau qxl radeon radeonsi vesa virtualbox vmware"
# The Gentoo binrepo sets verify-signature=true; a global signature requirement
# would also reject unsigned local packages made by Catalyst's --buildpkg.
# protect-owned permits unowned compatibility links created by Gentoo
# postinst hooks (for example cpio -> gcpio) while rejecting package collisions.
FEATURES="binpkg-logs buildpkg protect-owned parallel-fetch strict"
PYTHON_TARGETS="python3_14"
PYTHON_SINGLE_TARGET="python3_14"
