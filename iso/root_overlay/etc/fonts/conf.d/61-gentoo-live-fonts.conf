<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The live desktop's fonts (wave 5): Fira Sans for text, JetBrains Mono for code. Fontconfig
     reads the files in name order and a later "prefer" goes in front of an earlier one, so this
     file (61-) is read after the Latin defaults (60-latin.conf) and wins. DejaVu stays installed:
     fontconfig falls back to it for the scripts that Fira does not cover. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Fira Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
