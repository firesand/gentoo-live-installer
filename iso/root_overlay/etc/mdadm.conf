# Never assemble the RAID arrays that are found on the PC's disks by themselves (udev
# incremental assembly at boot or on hot-plug). gentoo-rescue assembles the arrays that
# the user selects, read-only and with a private configuration. Explicit commands such
# as "mdadm --assemble /dev/md0 /dev/sdb1 /dev/sdc1" and "mdadm --create" still work.
AUTO -all
