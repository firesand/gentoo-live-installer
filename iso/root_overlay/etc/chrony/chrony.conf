# chrony settings of the installer and rescue disc.
#
# Many PCs have a wrong or local-time hardware clock, and certificate and signature checks
# (the stage3 download, HTTPS, package signatures) fail when the date is wrong. Step the
# clock whenever it is more than a second off, not only during the first updates.
pool 2.gentoo.pool.ntp.org iburst
driftfile /var/lib/chrony/drift
makestep 1.0 -1

# There is deliberately no "rtcsync" and no "rtcfile": the live system never writes to
# the PC's hardware clock. Windows keeps local time in it, and a changed value would
# show up as a wrong time in the other operating system.
