# Tap to click on the touchpad, written by the Gentoo installer, values from CachyOS-Settings. The desktop's mouse and touchpad settings can still turn it off.
Section "InputClass"
	Identifier "installer touchpad tapping"
	MatchIsTouchpad "on"
	MatchDevicePath "/dev/input/event*"
	Driver "libinput"
	Option "Tapping" "on"
EndSection
