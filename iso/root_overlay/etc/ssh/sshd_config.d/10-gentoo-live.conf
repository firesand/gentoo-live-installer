# The live disc runs sshd on every boot (I9), so that a newcomer can reach the installer's
# computer from another one. Nobody can log in until a password is set on purpose:
# root is locked, the live user "gentoo" has an empty password, and this is the default
# written down, so that a later change of the default cannot open the empty-password account.
# sshd takes the FIRST value of a keyword and reads the drop-ins in name order, so this
# file (10-) is read before Gentoo's own 9999999gentoo-livecd.conf (PermitRootLogin Yes,
# the same as on the official media: set a root password with "sudo passwd root", then
# "ssh root@ADDRESS") and before the test drop-in 90-installer-vm-test.conf.
# Each boot makes its own host keys (the sshd init script runs ssh-keygen -A).
PermitEmptyPasswords no
