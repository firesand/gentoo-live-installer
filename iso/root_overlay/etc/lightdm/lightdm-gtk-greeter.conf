# The login screen (seen only after a log out: the live session logs in by itself).
# Same look as the desktop: Arc-Dark, Papirus-Dark, Fira Sans and the Indigo silk wallpaper.
[greeter]
theme-name = Arc-Dark
icon-theme-name = Papirus-Dark
font-name = Fira Sans 11
background = /usr/share/backgrounds/gentoo-live/indigo-silk.svg
user-background = false
default-user-image = #avatar-default
position = 50%,center
clock-format = %a %d %b  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~language;~a11y;~power
