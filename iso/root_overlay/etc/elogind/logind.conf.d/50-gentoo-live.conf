# The installer and rescue disc must never suspend by itself: an installation that is
# interrupted in the middle of writing the target system is much worse than a laptop that
# stays awake. Closing the lid and being idle do nothing; the power button keeps working.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
