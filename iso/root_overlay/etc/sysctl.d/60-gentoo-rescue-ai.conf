# The AI rescue stick (wave 6): Yama stops a process from reading or injecting into another process
# of the same user with ptrace (/proc/PID/mem, gdb, strace -p). The agents (Claude Code, Codex,
# OpenCode) all run as the user rescue-ai and can start other programs; with scope 1 only a parent
# can trace its own children, so an agent cannot attach to the tmux server or to another agent.
# Needs CONFIG_SECURITY_YAMA=y and "yama" in CONFIG_LSM: the live kernel gets both from
# /etc/kernel/config.d/51-gentoo-live-rescue-ai.config (app-admin/gentoo-live-installer[rescue-ai])
# and scripts/verify-iso.py reads boot/gentoo-config to be sure. OpenRC's sysctl service
# (boot runlevel) applies this file.
kernel.yama.ptrace_scope = 1
