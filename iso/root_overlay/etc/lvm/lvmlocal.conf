# Local LVM settings of the Gentoo installer and rescue disc.
#
# The live system must not activate the volume groups on the PC's disks by itself,
# neither at boot nor when a disk is plugged in: activating a damaged or foreign group
# can replay journals and thin-pool metadata and so write to a disk that somebody
# wants to rescue. gentoo-installerd and gentoo-rescue activate exactly the volume group
# that the user selected (explicit "vgchange -ay", which these two settings do not affect).
global {
	event_activation = 0
}

activation {
	auto_activation_volume_list = [ ]
}
