name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system packages for offscreen Qt and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 \
            fonts-dejavu-core shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' mypy ruff

      - name: Python & shell syntax, shellcheck, ruff, mypy
        run: |
          pycache=$(mktemp -d)
          PYTHONPYCACHEPREFIX="$pycache" python -m compileall -q src scripts tests apps/hwmonux
          rm -rf "$pycache"
          for file in $(find . -path ./.git -prune -o -type f -name '*.sh' -print | sort); do
            if head -n 1 "$file" | grep -q bash; then bash -n "$file"; else sh -n "$file"; fi
          done
          shellcheck -S warning $(find . -path ./.git -prune -o -type f -name '*.sh' -print | sort)
          ruff check --select E9,F63,F7,F82 src scripts tests apps/hwmonux
          findings=$(mktemp)
          python -m mypy --config-file pyproject.toml --no-error-summary \
            $(find src scripts apps/hwmonux -name '*.py' | sort) 2>&1 \
            | sed 's/^\([^:]*\):[0-9][0-9]*:/\1:/' | LC_ALL=C sort -u > "$findings" || true
          new=$(LC_ALL=C comm -13 scripts/mypy-baseline.txt "$findings")
          rm -f "$findings"
          if [ -n "$new" ]; then
            echo "New mypy findings:"
            echo "$new"
            exit 1
          fi

      - name: Fast pytest suite
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider -m 'not slow' \
            --ignore=tests/test_sandbox.py --ignore=tests/test_host_share.py

      - name: HWMonux smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python apps/hwmonux/hwmonux.py --dump > /dev/null

  rust:
    name: Rust companion apps (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portagehub, gentoo-settings, kernelsmith]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}

      - name: Install system libraries for egui/eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Run cargo test
        env:
          SKIP_EMERGE_TESTS: "1"
        run: cargo test --locked --manifest-path apps/${{ matrix.app }}/Cargo.toml

      - name: Run clippy (portagehub)
        if: matrix.app == 'portagehub'
        run: |
          baseline=$(cat scripts/clippy-baseline.txt)
          count=$(cargo clippy --locked --manifest-path apps/portagehub/Cargo.toml --all-targets --message-format=short 2>&1 | grep -c ': warning:' || true)
          echo "$count clippy warning(s), baseline $baseline"
          test "$count" -le "$baseline"
