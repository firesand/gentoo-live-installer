set default=0
set gfxpayload=keep
set timeout=10
insmod all_video
insmod png
insmod gfxterm
terminal_output gfxterm
set gfxmode=auto
set theme=/boot/grub/themes/gentoo_frosted/theme.txt

menuentry 'Boot LiveCD (kernel: gentoo)' --class gnu-linux --class os {
	search --no-floppy --set=root -l GENTOO_INSTALLER_AMD64
	linux /boot/gentoo dokeymap nodhcp secureconsole root=live:CDLABEL=GENTOO_INSTALLER_AMD64 rd.live.dir=/ rd.live.squashimg=image.squashfs cdroot
	initrd /boot/gentoo.igz
}

menuentry 'Boot LiveCD (kernel: gentoo) (cached)' --class gnu-linux --class os {
	search --no-floppy --set=root -l GENTOO_INSTALLER_AMD64
	linux /boot/gentoo dokeymap nodhcp secureconsole root=live:CDLABEL=GENTOO_INSTALLER_AMD64 rd.live.dir=/ rd.live.squashimg=image.squashfs cdroot rd.live.ram=1
  initrd /boot/gentoo.igz
}

menuentry 'Boot LiveCD (kernel: gentoo) (accessibility)' --class gnu-linux --class os {
  search --no-floppy --set=root -l GENTOO_INSTALLER_AMD64
  linux /boot/gentoo dokeymap nodhcp secureconsole root=live:CDLABEL=GENTOO_INSTALLER_AMD64 rd.live.dir=/ rd.live.squashimg=image.squashfs cdroot dospeakup
	initrd /boot/gentoo.igz
}

